name: Build and test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: "npm"
      - name: Start Mailpit
        uses: StanleyMasinde/mailpit-action@v0.1.0
      - name: Setup MySQL database
        run: |
          sudo systemctl start mysql.service
          mysql -u root -proot  -e "create database staticsend"
      - name: Setup PNPM
        run: |
            corepack enable
            corepack prepare pnpm@latest --activate
      - name: Setup environment variables
        run: cp .env.example .env
      - name: Install deps
        run: pnpm i
      - name: Test 🧪
        run: npm test