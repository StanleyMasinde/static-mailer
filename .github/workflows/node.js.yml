name: Build and test
"on":
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
      - name: Start Mailpit
        uses: StanleyMasinde/mailpit-action@v0.1.0
      - name: Setup MySQL database
        run: |
          sudo systemctl start mysql.service
          mysql -u root -proot  -e "create database staticsend"
      - name: Setup PNPM
        run: |
            corepack enable
            corepack prepare pnpm@latest --activate
      - name: Setup environment variables
        run: cp .env.example .env
      - name: Install deps
        run: pnpm i
      - name: Lint 🧐
        run: |
            pnpm run lint
      - name: Test 🧪
        run: pnpm test

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(node -p 'require("./package.json").version')
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Expected a stable version tag matching package.json (v$package_version), got $RELEASE_TAG" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi

          gh release create "$RELEASE_TAG" --verify-tag --generate-notes
