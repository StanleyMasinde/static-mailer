name: Node.js CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
    - name: Start mailpit
      uses: StanleyMasinde/mailpit-action@v0.1.0
    - name: Setup database
      run: | 
          sudo systemctl start mysql.service
          mysql -u root -proot  -e "create database staticsend"
    - name: Setup environment variables
      run: cp .env.example .env
    - name: Install deps
      run: npm ci
    - name: Build and test
      run: |
         npm run build --if-present
         npm test
