openapi: 3.2.0
info:
  title: StaticMailer API
  version: 1.1.0
  description: |
    StaticMailer API for authentication, API key lifecycle, and public email delivery.

    JSON:API contract for `/v1/*` and `/api/v1/*`:
    - `Accept: application/vnd.api+json`
    - `Content-Type: application/vnd.api+json` for POST/PUT/PATCH
    - Request bodies are flat JSON objects
    - Responses use JSON:API documents
servers:
  - url: https://localhost:3000
    description: Local development
tags:
  - name: Health
  - name: Dashboard
  - name: Auth
  - name: API Keys
  - name: Delivery
paths:
  /ping:
    get:
      tags: [Health]
      summary: Health check
      operationId: ping
      responses:
        '200':
          description: Pong
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Pong

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Redirect to configured dashboard URL
      operationId: dashboard
      responses:
        '302':
          description: Redirect to dashboard URL
        '404':
          description: Dashboard URL not configured
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'

  /v1/register:
    post:
      tags: [Auth]
      summary: Register user
      operationId: register
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/RegisterRequestBody'
            examples:
              register:
                value:
                  name: Jane Doe
                  email: jane@example.com
                  password: supersecretpassword
      responses:
        '201':
          description: User created
          content:
            application/vnd.api+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiDataDocument'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResource'
                      meta:
                        type: object
                        properties:
                          token:
                            type: string
                          refresh_token:
                            type: string
              examples:
                created:
                  value:
                    jsonapi: { version: '1.1' }
                    data:
                      type: users
                      id: '1'
                      attributes:
                        name: Jane Doe
                        email: jane@example.com
                    meta:
                      token: <jwt>
                      refresh_token: <refresh-token>
        '400': { $ref: '#/components/responses/JsonApiBadRequest' }
        '406': { $ref: '#/components/responses/JsonApiNotAcceptable' }
        '415': { $ref: '#/components/responses/JsonApiUnsupportedMediaType' }
        '422':
          description: Validation error or duplicate email
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'

  /v1/login:
    post:
      tags: [Auth]
      summary: Login with email/password
      operationId: login
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/LoginRequestBody'
            examples:
              login:
                value:
                  email: jane@example.com
                  password: supersecretpassword
      responses:
        '200':
          description: Authenticated
          content:
            application/vnd.api+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiDataDocument'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResource'
              examples:
                ok:
                  value:
                    jsonapi: { version: '1.1' }
                    data:
                      type: tokens
                      id: '1'
                      attributes:
                        token: <jwt>
                        refresh_token: <refresh-token>
        '400': { $ref: '#/components/responses/JsonApiBadRequest' }
        '401': { $ref: '#/components/responses/JsonApiUnauthorized' }
        '406': { $ref: '#/components/responses/JsonApiNotAcceptable' }
        '415': { $ref: '#/components/responses/JsonApiUnsupportedMediaType' }
        '422':
          description: Validation error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'

  /v1/token/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue a new token pair
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestBody'
            examples:
              refresh:
                value:
                  refresh_token: <refresh-token>
      responses:
        '200':
          description: Token pair rotated
          content:
            application/vnd.api+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiDataDocument'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResource'
              examples:
                ok:
                  value:
                    jsonapi: { version: '1.1' }
                    data:
                      type: tokens
                      id: '1'
                      attributes:
                        token: <jwt>
                        refresh_token: <refresh-token>
        '400': { $ref: '#/components/responses/JsonApiBadRequest' }
        '401': { $ref: '#/components/responses/JsonApiUnauthorized' }
        '406': { $ref: '#/components/responses/JsonApiNotAcceptable' }
        '415': { $ref: '#/components/responses/JsonApiUnsupportedMediaType' }
        '422':
          description: Validation error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'

  /v1/me:
    get:
      tags: [Auth]
      summary: Get current user
      operationId: me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/vnd.api+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiDataDocument'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserDetailResource'
        '401': { $ref: '#/components/responses/JsonApiUnauthorized' }
        '404':
          description: Authenticated user not found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
        '406': { $ref: '#/components/responses/JsonApiNotAcceptable' }

  /v1/password-reset:
    post:
      tags: [Auth]
      summary: Request password reset instructions
      operationId: passwordReset
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestBody'
            examples:
              request:
                value:
                  email: jane@example.com
      responses:
        '200':
          description: Generic success response
          content:
            application/vnd.api+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiDataDocument'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PasswordResetRequestResource'
              examples:
                ok:
                  value:
                    jsonapi: { version: '1.1' }
                    data:
                      type: password_reset_requests
                      attributes:
                        message: If the account exists, password reset instructions have been sent.
        '400': { $ref: '#/components/responses/JsonApiBadRequest' }
        '406': { $ref: '#/components/responses/JsonApiNotAcceptable' }
        '415': { $ref: '#/components/responses/JsonApiUnsupportedMediaType' }
        '422':
          description: Validation error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'

  /v1/password-update:
    post:
      tags: [Auth]
      summary: Update password with reset code
      operationId: passwordUpdate
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequestBody'
            examples:
              update:
                value:
                  email: jane@example.com
                  code: '123456'
                  password: newstrongpassword
      responses:
        '200':
          description: Password updated
          content:
            application/vnd.api+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiDataDocument'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PasswordResetResultResource'
        '400': { $ref: '#/components/responses/JsonApiBadRequest' }
        '406': { $ref: '#/components/responses/JsonApiNotAcceptable' }
        '415': { $ref: '#/components/responses/JsonApiUnsupportedMediaType' }
        '422':
          description: Validation error or invalid/expired code
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'

  /v1/social-auth/{provider}:
    post:
      tags: [Auth]
      summary: Social auth login
      description: |
        Exchanges a Google ID token or GitHub OAuth access token for a StaticMailer access token and refresh token.

        Flow:
        1. Send `POST /v1/social-auth/google` with a Google ID token, or `POST /v1/social-auth/github` with a GitHub OAuth token.
        2. Server verifies token claims and resolves provider identity (`sub`) and verified email.
        3. Server checks provider linkage in `social_accounts` using (`provider`, `provider_user_id=sub`).
        4. If link exists, signs in linked user and returns `200`.
        5. If link does not exist:
           - if a local user exists by email, server creates link and returns `200`;
           - otherwise server creates user + link and returns `201`.
        6. If `GOOGLE_CLIENT_ID` is not configured, returns `500`.
      operationId: socialAuth
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/SocialAuthRequestBody'
            examples:
              google:
                value:
                  token: <google-id-token>
              github:
                value:
                  token: <github-oauth-token>
      responses:
        '200':
          description: Token issued for an existing linked user (or an existing user linked by email on first social login)
          content:
            application/vnd.api+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiDataDocument'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResource'
              examples:
                existingUser:
                  value:
                    jsonapi:
                      version: '1.1'
                    data:
                      type: tokens
                      id: '42'
                      attributes:
                        token: <jwt-access-token>
                        refresh_token: <refresh-token>
        '201':
          description: Token issued for a newly created user (social account link created)
          content:
            application/vnd.api+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiDataDocument'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResource'
              examples:
                newUser:
                  value:
                    jsonapi:
                      version: '1.1'
                    data:
                      type: tokens
                      id: '43'
                      attributes:
                        token: <jwt-access-token>
                        refresh_token: <refresh-token>
        '400':
          description: Invalid provider, missing token, or invalid token
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
              examples:
                invalidProvider:
                  value:
                    jsonapi:
                      version: '1.1'
                    errors:
                      - status: '400'
                        title: Invalid provider
                        detail: The provider is not supported. Supported providers are Google and GitHub.
                missingToken:
                  value:
                    jsonapi:
                      version: '1.1'
                    errors:
                      - status: '400'
                        title: Missing token
                        detail: Token is missing from the request body.
                invalidToken:
                  value:
                    jsonapi:
                      version: '1.1'
                    errors:
                      - status: '400'
                        title: Invalid token
                        detail: The provided token is invalid.
        '406': { $ref: '#/components/responses/JsonApiNotAcceptable' }
        '415': { $ref: '#/components/responses/JsonApiUnsupportedMediaType' }
        '500':
          description: Google auth not configured (applies to the Google provider only)
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
              examples:
                configError:
                  value:
                    jsonapi:
                      version: '1.1'
                    errors:
                      - status: '500'
                        title: Server configuration error
                        detail: Google social authentication is not configured.

  /v1/apiKeys:
    post:
      tags: [API Keys]
      summary: Create API key
      operationId: createApiKey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequestBody'
            examples:
              create:
                value:
                  name: portfolio-site
      responses:
        '201':
          description: API key created. `meta.raw_key` is shown once.
          content:
            application/vnd.api+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiDataDocument'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ApiKeyResource'
                      meta:
                        type: object
                        properties:
                          raw_key:
                            type: string
              examples:
                created:
                  value:
                    jsonapi: { version: '1.1' }
                    data:
                      type: api_keys
                      id: 7a4d8f63-a7df-46dc-8c10-20569566aabc
                      attributes:
                        name: portfolio-site
                        key_last4: A1B2
                        created_at: '2026-04-04T13:00:00.000Z'
                        updated_at: '2026-04-04T13:00:00.000Z'
                        last_used_at: null
                    meta:
                      raw_key: sk_live_example_raw_key
        '400': { $ref: '#/components/responses/JsonApiBadRequest' }
        '401': { $ref: '#/components/responses/JsonApiUnauthorized' }
        '406': { $ref: '#/components/responses/JsonApiNotAcceptable' }
        '415': { $ref: '#/components/responses/JsonApiUnsupportedMediaType' }
        '422':
          description: Validation error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
        '500':
          description: Server error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'

    get:
      tags: [API Keys]
      summary: List current user's API keys
      operationId: getApiKeys
      security:
        - bearerAuth: []
      responses:
        '200':
          description: API key list
          content:
            application/vnd.api+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiDataDocument'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApiKeyResource'
        '401': { $ref: '#/components/responses/JsonApiUnauthorized' }
        '406': { $ref: '#/components/responses/JsonApiNotAcceptable' }

  /v1/apiKeys/{uuid}:
    delete:
      tags: [API Keys]
      summary: Delete API key
      operationId: deleteApiKey
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/JsonApiUnauthorized' }
        '403':
          description: Deleting another user's key
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
        '404':
          description: API key not found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
        '406': { $ref: '#/components/responses/JsonApiNotAcceptable' }

  /api/v1/deliver/{apiKey}:
    post:
      tags: [Delivery]
      summary: Deliver email via raw API key
      operationId: deliverEmail
      parameters:
        - name: apiKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/DeliverRequestBody'
            examples:
              deliver:
                value:
                  subject: Hello
                  email: visitor@example.com
                  message: I would like to work with you.
      responses:
        '202':
          description: Accepted for delivery
          content:
            application/vnd.api+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiDataDocument'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeliveryResource'
              examples:
                accepted:
                  value:
                    jsonapi: { version: '1.1' }
                    data:
                      type: deliveries
                      attributes:
                        status: accepted
                        message: Message accepted for delivery.
        '400': { $ref: '#/components/responses/JsonApiBadRequest' }
        '404':
          description: Invalid API key
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
        '406': { $ref: '#/components/responses/JsonApiNotAcceptable' }
        '415': { $ref: '#/components/responses/JsonApiUnsupportedMediaType' }
        '422':
          description: Validation error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
        '429':
          description: Rate limit exceeded
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
        '502':
          description: Mail transport failed
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'
        '500':
          description: Server error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiErrorDocument'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    JsonApiBadRequest:
      description: Bad Request
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiErrorDocument'
    JsonApiUnauthorized:
      description: Unauthorized
      headers:
        WWW-Authenticate:
          description: Bearer challenge
          schema:
            type: string
            example: Bearer
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiErrorDocument'
    JsonApiNotAcceptable:
      description: Unsupported Accept header
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiErrorDocument'
    JsonApiUnsupportedMediaType:
      description: Unsupported Content-Type header
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiErrorDocument'

  schemas:
    RegisterAttributes:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string

    LoginAttributes:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    PasswordResetAttributes:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    RefreshTokenAttributes:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    PasswordUpdateAttributes:
      type: object
      required: [email, code, password]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: Password reset code sent to email
        password:
          type: string

    SocialAuthAttributes:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Social provider token. Use a Google ID token for `google` or a GitHub OAuth token for `github`.

    CreateApiKeyAttributes:
      type: object
      required: [name]
      properties:
        name:
          type: string

    DeliverAttributes:
      type: object
      required: [subject, email, message]
      properties:
        subject:
          type: string
        email:
          type: string
          format: email
        message:
          type: string

    RegisterRequestBody:
      $ref: '#/components/schemas/RegisterAttributes'

    LoginRequestBody:
      $ref: '#/components/schemas/LoginAttributes'

    RefreshTokenRequestBody:
      $ref: '#/components/schemas/RefreshTokenAttributes'

    PasswordResetRequestBody:
      $ref: '#/components/schemas/PasswordResetAttributes'

    PasswordUpdateRequestBody:
      $ref: '#/components/schemas/PasswordUpdateAttributes'

    SocialAuthRequestBody:
      $ref: '#/components/schemas/SocialAuthAttributes'

    CreateApiKeyRequestBody:
      $ref: '#/components/schemas/CreateApiKeyAttributes'

    DeliverRequestBody:
      $ref: '#/components/schemas/DeliverAttributes'

    JsonApiDocument:
      type: object
      properties:
        jsonapi:
          type: object
          properties:
            version:
              type: string
              example: '1.1'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true

    JsonApiDataDocument:
      allOf:
        - $ref: '#/components/schemas/JsonApiDocument'
        - type: object
          required: [data]
          properties:
            data:
              oneOf:
                - type: object
                - type: array
                  items: { type: object }
                - type: 'null'

    JsonApiErrorSource:
      type: object
      properties:
        pointer: { type: string }
        parameter: { type: string }
        header: { type: string }

    JsonApiError:
      type: object
      required: [title]
      properties:
        status:
          oneOf:
            - type: string
            - type: integer
        code: { type: string }
        title: { type: string }
        detail: { type: string }
        source:
          $ref: '#/components/schemas/JsonApiErrorSource'
        meta:
          type: object
          additionalProperties: true

    JsonApiErrorDocument:
      allOf:
        - $ref: '#/components/schemas/JsonApiDocument'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/JsonApiError'

    UserAttributes:
      type: object
      properties:
        name: { type: string }
        email:
          type: string
          format: email

    UserDetailAttributes:
      allOf:
        - $ref: '#/components/schemas/UserAttributes'
        - type: object
          properties:
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    UserResource:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
          example: users
        id: { type: string }
        attributes:
          $ref: '#/components/schemas/UserAttributes'

    UserDetailResource:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
          example: users
        id: { type: string }
        attributes:
          $ref: '#/components/schemas/UserDetailAttributes'

    TokenResource:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
          example: tokens
        id: { type: string }
        attributes:
          type: object
          required: [token, refresh_token]
          properties:
            token: { type: string }
            refresh_token: { type: string }

    ApiKeyAttributes:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name: { type: string }
        key_last4:
          type:
            - string
            - 'null'
          minLength: 4
          maxLength: 4
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time

    ApiKeyResource:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
          example: api_keys
        id:
          type: string
          format: uuid
        attributes:
          $ref: '#/components/schemas/ApiKeyAttributes'

    DeliveryResource:
      type: object
      required: [type, attributes]
      properties:
        type:
          type: string
          example: deliveries
        attributes:
          type: object
          properties:
            status:
              type: string
              example: accepted
            message:
              type: string
              example: Message accepted for delivery.

    PasswordResetRequestResource:
      type: object
      required: [type, attributes]
      properties:
        type:
          type: string
          example: password_reset_requests
        attributes:
          type: object
          properties:
            message:
              type: string
              example: If the account exists, password reset instructions have been sent.

    PasswordResetResultResource:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
          example: password_resets
        id: { type: string }
        attributes:
          type: object
          properties:
            status:
              type: string
              example: success
            message:
              type: string
              example: Your password has been successfully reset.
